  <text x="400" y="88" text-anchor="middle" font-family="monospace" font-size="66" fill="url(#ink)" font-weight="bold" letter-spacing="10">vouch</text>
  <text x="400" y="120" text-anchor="middle" font-family="monospace" font-size="15" fill="#cdecff" letter-spacing="2">put your name on every dependency</text>
