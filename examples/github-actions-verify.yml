name: vouch (verify approvals)
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  vouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx vouch check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
